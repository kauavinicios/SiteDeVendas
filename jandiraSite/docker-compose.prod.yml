x-prod-defaults: &prod-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    <<: *prod-defaults

  php:
    <<: *prod-defaults
    image: jandira-php:${IMAGE_TAG:-prod}
    build:
      target: production

  worker:
    <<: *prod-defaults
    image: jandira-php:${IMAGE_TAG:-prod}
    build:
      target: production

  scheduler:
    <<: *prod-defaults
    image: jandira-php:${IMAGE_TAG:-prod}
    build:
      target: production

  caddy:
    <<: *prod-defaults
    image: jandira-caddy:${IMAGE_TAG:-prod}
    build:
      target: production
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?Defina SITE_ADDRESS no .env (ex.: seudominio.com.br ou :80)}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
