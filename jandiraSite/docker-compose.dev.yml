x-php-dev: &php-dev
  image: jandira-php:dev
  build:
    target: development
  volumes:
    - .:/var/www/html
    - storage_public:/var/www/html/storage/app/public
    - storage_private:/var/www/html/storage/app/private
    - storage_logs:/var/www/html/storage/logs
    - dev_storage_framework:/var/www/html/storage/framework
    - dev_bootstrap_cache:/var/www/html/bootstrap/cache

services:
  postgres:
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5434}:5432"

  php:
    <<: *php-dev
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      CONTAINER_ROLE: app
      APP_URL: ${DEV_APP_URL:-http://127.0.0.1:8080}

  worker:
    <<: *php-dev
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      CONTAINER_ROLE: worker
      APP_URL: ${DEV_APP_URL:-http://127.0.0.1:8080}

  scheduler:
    <<: *php-dev
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      CONTAINER_ROLE: scheduler
      APP_URL: ${DEV_APP_URL:-http://127.0.0.1:8080}

  caddy:
    image: jandira-caddy:dev
    build:
      target: development
    environment:
      SITE_ADDRESS: :80
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - storage_public:/var/www/html/storage/app/public:ro
      - caddy_data:/data
      - caddy_config:/config

  vite:
    profiles: ["vite"]
    image: node:24-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    command: ["sh", "-c", "npm run vite -- --host 0.0.0.0 --port 5173"]
    networks:
      - webapp

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.22
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - webapp

volumes:
  dev_storage_framework: {}
  dev_bootstrap_cache: {}
