name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    # A aplicação Laravel fica na subpasta jandiraSite/
    defaults:
      run:
        working-directory: jandiraSite

    # Mesmo banco/credenciais usados localmente pelo scripts/test-env.sh
    # (ver <php><env> do phpunit.xml).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jandira
          POSTGRES_PASSWORD: jandira_test
          POSTGRES_DB: jandira_phpunit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jandira -d jandira_phpunit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: pdo_pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: jandiraSite/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Tests
        run: ./vendor/bin/phpunit
